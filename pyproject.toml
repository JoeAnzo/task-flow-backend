[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoeAnzo", email = "joelanzovule@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "dj-rest-auth[with-social]>=7.2.0",
    "django>=6.1.2",
    "django-allauth>=65.21.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "whistle>=2.1.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
